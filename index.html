<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veterinaria Huellitas</title>

  <!-- ETAPA 2: Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Estilos propios (siempre después de Bootstrap) -->
  <link href="styles.css" rel="stylesheet">
</head>

<body>

  <div class="container mt-5 mb-5" style="max-width: 560px;">

    <div class="encabezado">
      <h1>Veterinaria Huellitas 🐾</h1>
      <h2>Registro de mascotas</h2>
    </div>

    <div class="tarjeta">
      <label for="nombre" class="form-label">Nombre:</label>
      <input id="nombre" type="text" class="form-control mb-3" placeholder="Ej: Luna">

      <label for="especie" class="form-label">Especie:</label>
      <select id="especie" class="form-select mb-3">
        <option>Perro</option>
        <option>Gato</option>
      </select>

      <label for="edad" class="form-label">Edad:</label>
      <input id="edad" type="number" class="form-control mb-4" placeholder="Ej: 3">

      <button id="registrar" class="btn btn-primary">Registrar mascota</button>

      <p class="titulo-lista">Mascotas registradas</p>
      <ul id="lista" class="list-group"></ul>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
